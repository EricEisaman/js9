<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN"
   "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge;chrome=1" > 
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link type="image/x-icon" rel="shortcut icon" href="./favicon.ico">
  <link type="text/css" rel="stylesheet" href="js9support.css">
  <link type="text/css" rel="stylesheet" href="js9.css">
  <link rel="apple-touch-icon" href="images/js9-apple-touch-icon.png">
  <script type="text/javascript" src="js9prefs.js"></script>
  <script type="text/javascript" src="js9support.min.js"></script>
  <script type="text/javascript" src="js9.min.js"></script>
  <script type="text/javascript" src="js9plugins.js"></script>
  <style type="text/css">
      #div {
          position: relative;
          top:  25px;
          left: 25px;
      }
  </style>
  <title>JS9</title>
</head>
<body>
    <div id="div">
    <div class="JS9Menubar"></div>
    <div class="JS9Toolbar"></div>
    <div class="JS9"></div>
    <div style="margin-top: 2px;"><div class="JS9Statusbar"></div></div>
    </div>
    <script type="text/javascript">
      $(document).ready(function(){
          $("#div").draggable({
            handle: "#JS9Menubar",
            opacity: 0.35
          });
      });
    </script>
<p>
<!-- js9/mhq/overlay.html — Mount fragment for forked JS9 -->
<!-- Copy this block into your JS9 page (e.g. js9.html / nso.html) just before </body>. -->
<!-- It is the ONLY HTML change to the fork. JS9 still works without it. -->
<!-- <div id="mhq-overlay"> ... </div> -->

<div id="mhq-overlay">
  <!-- HUD floats top-right, Map lives in HQ. Overlay holds JS9-side controls only. -->
  <style>
    #mhq-overlay { font-family: system-ui, sans-serif; }
    #mhq-overlay .mhq-bar {
      position: fixed; left: 12px; bottom: 12px; z-index: 9999;
      display: flex; gap: 8px; flex-wrap: wrap; max-width: 92vw;
      background: rgba(5,10,18,.92); border: 1px solid #1e3a5f; border-radius: 12px; padding: 10px;
      color: #eaf2ff; font-size: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    #mhq-overlay button { padding: 8px 12px; border: 0; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 12px; }
    #mhq-overlay .primary { background: #22d3ee; color: #04121f; }
    #mhq-overlay .ghost { background: #1e293b; color: #fff; }
    #mhq-overlay .status { align-self: center; color: #9db4d6; }
    #mhq-overlay .status b { color: #eaf2ff; }
    @media (max-width: 640px) { #mhq-overlay .mhq-bar { left: 8px; right: 8px; bottom: 8px; } }
  </style>

  <div class="mhq-bar" role="region" aria-label="Mission Headquarters">
    <span class="status">Mission: <b>JS9 Olympiad</b> <span id="mhq-progress">—</span></span>
    <button class="primary" id="mhq-record-diameter" type="button">Record Diameter</button>
    <button class="ghost" id="mhq-record-rgb" type="button">Record 3-Color</button>
    <button class="ghost" id="mhq-snapshot" type="button">Snapshot PNG</button>
    <button class="ghost" id="mhq-back-hq" type="button">← Back to HQ</button>
  </div>
  <script src="mhq/autoload_v1.js"></script>
  <script type="module">
    // HUD component (floats top-right) + JS9 bridge (hooks JS9 events)
    import 'https://ericeisaman.github.io/mission-hq/ui/hud.js';
    import './mhq/bridge.js';

    const hud = document.createElement('mhq-hud');
    hud.setAttribute('mission', 'js9-olympiad-v1');
    document.getElementById('mhq-overlay').appendChild(hud);

    // Wire overlay buttons to window.mhq.js9 helpers (defined in bridge.js)
    const $ = (id) => document.getElementById(id);
    const setProgress = async () => {
      try {
        const s = await window.mhq.getState();
        $('mhq-progress').textContent = (s?.progress ?? 0) + '%';
      } catch {}
    };
    const waitMhq = async () => {
      for (let i = 0; i < 50; i++) {
        if (window.mhq?.js9) return window.mhq;
        await new Promise(r => setTimeout(r, 200));
      }
      return null;
    };
    (async () => {
      const mhq = await waitMhq();
      if (!mhq) return;
      await setProgress();
      mhq.on('state:changed', setProgress);

      $('mhq-record-diameter').onclick = async () => {
        const d = mhq.js9._latestDiameter || mhq.js9.diameterFromRegions(mhq.js9.getRegions());
        if (!d) { alert('Draw a Circle or Box region spanning Cas A first (JS9 Region menu).'); return; }
        const arcsec = d.diameterPixels * 0.5;
        const res = await mhq.js9.recordMeasurement('casa-diameter', {
          valuePixels: d.diameterPixels, arcsec, shape: d.shape, raw: d.raw,
          calculation: `${d.diameterPixels} pix × 0.5"/pix = ${arcsec}"`
        });
        alert(res?.done ? `Recorded: ${arcsec}" diameter` : 'Recorded — check HQ for validation.');
        await setProgress();
      };
      $('mhq-record-rgb').onclick = async () => {
        // Student must have applied 3 filters in JS9 first — we record their claim with filter strings.
        const low = prompt('Low filter (e.g. energy=600:1650)', 'energy=600:1650');
        const med = prompt('Medium filter (e.g. energy=1650:2250)', 'energy=1650:2250');
        const hard = prompt('Hard filter (e.g. energy=2250:7500)', 'energy=2250:7500');
        if (!low || !med || !hard) return;
        const res = await mhq.js9.recordRGB([
          { band: 'low', range: low, color: 'red' },
          { band: 'medium', range: med, color: 'green' },
          { band: 'hard', range: hard, color: 'blue' },
        ]);
        alert(res?.done ? '3-Color recorded.' : 'Recorded — check HQ.');
        await setProgress();
      };
      $('mhq-snapshot').onclick = async () => {
        const id = await mhq.js9.snapshot('snapshot');
        alert(id ? `Snapshot saved: ${id}` : 'No canvas found to snapshot.');
      };
      $('mhq-back-hq').onclick = () => { location.href = 'https://ericeisaman.github.io/mission-hq/'; };
    })();
  </script>
</div>
</body>
</html>
