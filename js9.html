<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>National Science Olympiad Test Page</title>
<link rel="stylesheet" href="https://voparis-apericubes.obspm.fr/apericubes/js9/js9support.css">
<link rel="stylesheet" href="https://voparis-apericubes.obspm.fr/apericubes/js9/js9.css">
<script src="https://voparis-apericubes.obspm.fr/apericubes/js9/js9support.min.js"></script>
<script src="https://voparis-apericubes.obspm.fr/apericubes/js9/js9.min.js"></script>
<script src="https://voparis-apericubes.obspm.fr/apericubes/js9/js9plugins.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05070d;color:#e8eef7;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.top{position:sticky;top:0;z-index:10;background:rgba(8,12,20,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1c2a44;padding:12px 18px 14px}
.top-title{font-size:15px;font-weight:800;letter-spacing:.02em;margin:0 0 10px}
.preload{display:flex;flex-wrap:wrap;gap:8px}
.preload button{appearance:none;border:1px solid #2a3d63;background:#0e1626;color:#dbe7ff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.preload button:hover{border-color:#38e6ff;background:#14223a;transform:translateY(-1px)}
.preload button.active{background:#38e6ff;color:#04121a;border-color:#38e6ff}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:16px;padding:16px;max-width:1440px;margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:#0b1220;border:1px solid #1c2a44;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.card-main{padding:0}
.card-main .JS9Menubar{padding:8px 10px 0}
.card-main .JS9{border-radius:0}
.card-main .JS9Colorbar{padding:8px 10px 10px}
.side{display:flex;flex-direction:column;gap:16px}
.side .card{padding:12px}
.side .JS9Magnifier,.side .JS9Panner{border-radius:12px;overflow:hidden}
.side .JS9Info{font-size:13px;line-height:1.5}
.JS9{width:100%!important}
</style>
</head>
<body>
<div class="top">
<div class="top-title">National Science Olympiad Test Page</div>
<div class="preload">
<button id="btn-casa" onclick="loadNSO('casa',this)">CAS-A (Chandra)</button>
<button onclick="loadNSO('cenx3',this)">Cen-X3 (Chandra)</button>
<button onclick="loadNSO('gkper',this)">GK-Per (Chandra)</button>
<button onclick="loadNSO('tycho',this)">Tycho&apos;s SNR (Chandra)</button>
<button onclick="loadNSO('g292',this)">G292.0+1.8 (Chandra)</button>
<button onclick="loadNSO('cartwheel',this)">Cartwheel Galaxy (Chandra)</button>
</div>
</div>
<div class="wrap">
<div class="card card-main">
<div class="JS9Menubar" data-width="100%"></div>
<div class="JS9" data-width="100%" data-height="620px"></div>
<div><div class="JS9Colorbar" data-width="100%" data-height="12px"></div></div>
</div>
<div class="side">
<div class="card"><div class="JS9Magnifier" data-width="248px" data-height="248px"></div></div>
<div class="card"><div class="JS9Panner" data-width="248px" data-height="248px"></div></div>
<div class="card"><div class="JS9Info" data-height="230px"></div></div>
</div>
</div>
<script>
var BASE='https://voparis-apericubes.obspm.fr/apericubes/js9/data/fits/';
function loadNSO(name,el){document.querySelectorAll('.preload button').forEach(function(b){b.classList.remove('active')});if(el)el.classList.add('active');JS9.Load(BASE+name+'.fits',{scale:'log',colormap:'heat',contrast:1.6,bias:0.55});}
window.addEventListener('load',function(){document.getElementById('btn-casa').classList.add('active');loadNSO('casa',document.getElementById('btn-casa'));});
</script>
</body>
</html>
