# Deploy static JS9 to Pages — no Jekyll
# Replaces the old jekyll-build-pages workflow.
# JS9 is prebuilt static HTML/JS. Jekyll must never run over it.
# Broken external-data symlinks are removed in CI before upload.
name: Deploy static JS9 to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude '/.git/' \
            --exclude '/.github/' \
            --exclude '/_site/' \
            --exclude '/node_modules/' \
            --exclude '/tests/data' \
            --exclude '/demos/data' \
            --exclude '/tests2/' \
            --exclude '/old/' \
            --exclude '/notes/' \
            --exclude '/tmp/' \
            --exclude '/talks/' \
            ./ _site/
          rm -rf _site/demos/data
          mkdir -p _site/demos/data
          printf 'This directory is intentionally empty in the Pages deployment.\n' > _site/demos/data/README.txt
          cp js9.html _site/index.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
